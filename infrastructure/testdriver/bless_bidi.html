<!DOCTYPE html>
<meta charset="utf-8">
<title>TestDriver bless method backed by WebDriver BiDi user activation</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js?feature=bidi"></script>
<script src="/resources/testdriver-vendor.js"></script>
<body>
<script>
promise_test(async () => {
  assert_false(navigator.userActivation.isActive,
    "should have no activation before bless");
  await test_driver.bless('user activation', () => {
    assert_true(navigator.userActivation.isActive,
      "should be active inside the action");
  });
  assert_true(navigator.userActivation.isActive,
    "should still be active immediately after bless");
}, 'grants user activation to the current window');

promise_test(async (t) => {
  const iframe = document.createElement('iframe');
  document.body.appendChild(iframe);
  t.add_cleanup(() => iframe.remove());
  const iframeWindow = iframe.contentWindow;
  assert_false(iframeWindow.navigator.userActivation.isActive,
    "iframe should have no activation before bless");
  await test_driver.bless('iframe user activation', null, iframeWindow);
  assert_true(iframeWindow.navigator.userActivation.isActive,
    "iframe should be active after bless");
}, 'grants user activation to an iframe passed as context');

promise_test(() => {
  return test_driver.bless('demonstrates return value without action')
    .then((value) => {
      assert_equals(value, null);
    });
}, 'no action function provided');

promise_test(() => {
  const expectedValue = {};
  return test_driver.bless('demonstrate a synchronous return value', () => {
      return expectedValue;
    }).then((actualValue) => {
      assert_equals(actualValue, expectedValue,
        'the promise should be fulfilled with the returned value');
    });
}, 'synchronous return value');

promise_test(() => {
  const expectedError = new Error();
  return test_driver.bless('demonstrates a synchronous error', () => {
     throw expectedError;
    })
    .then(() => {
      assert_unreached('the promise should be rejected');
    }, (actualError) => {
      assert_equals(actualError, expectedError,
        'the promise should be rejected with the thrown value');
    });
}, 'synchronous error');

promise_test(() => {
  const expectedValue = {};
  return test_driver.bless('demonstrate an asynchronous return value', () => {
      return Promise.resolve(expectedValue);
    }).then((actualValue) => {
      assert_equals(actualValue, expectedValue,
        'the promise should be fulfilled with the fulfillment value');
    });
}, 'asynchronous return value');

promise_test(() => {
  const expectedError = new Error();
  return test_driver.bless('demonstrates an asynchronous error', () => {
     return Promise.reject(expectedError);
    })
    .then(() => {
      assert_unreached('the promise should be rejected');
    }, (actualError) => {
      assert_equals(actualError, expectedError,
        'the promise should be rejected with the rejected value');
    });
}, 'asynchronous error');
</script>
</body>
